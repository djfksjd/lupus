  :root {
    --ground:#f3f6fa; --panel:#ffffff; --raised:#eef2f8; --line:#d3dbe7; --line-strong:#b3bfd1;
    --ink:#0e1a2c; --muted:#52627a; --faint:#c9d2df; --accent:#1d5cb5; --accent-ink:#ffffff; --edge:#9aa8bd; --danger:#c8373f;
    --k-project:#56657c; --k-goal:#2b6bdc; --k-lesson:#a06f00; --k-decision:#7648d2; --k-fact:#1b8a51;
    --k-procedure:#c93b42; --k-preference:#c25f17;
    --side:348px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) {
      --ground:#0b121e; --panel:#101a2a; --raised:#172438; --line:#22314a; --line-strong:#33466a;
      --ink:#e9eff8; --muted:#93a4bf; --faint:#2a3a55; --accent:#9cc4f2; --accent-ink:#0b121e; --edge:#55688a; --danger:#f0787a;
      --k-project:#c4cfe0; --k-goal:#6ea8ff; --k-lesson:#e2b54a; --k-decision:#b594f5; --k-fact:#5fca8f;
      --k-procedure:#f0787a; --k-preference:#f2995a;
    }
  }
  :root[data-theme=dark] {
    --ground:#0b121e; --panel:#101a2a; --raised:#172438; --line:#22314a; --line-strong:#33466a;
    --ink:#e9eff8; --muted:#93a4bf; --faint:#2a3a55; --accent:#9cc4f2; --accent-ink:#0b121e; --edge:#55688a; --danger:#f0787a;

    --k-procedure:#f0787a; --k-preference:#f2995a;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:var(--ground); color:var(--ink);
               font:13px/1.55 "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
               font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; }
  ::selection { background:var(--accent); color:var(--accent-ink); }
  * { scrollbar-width:thin; scrollbar-color:var(--line-strong) transparent; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  svg { display:block; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }

  #graph { position:fixed; inset:0 var(--side) 0 0; cursor:grab; }
  #graph:active { cursor:grabbing; }
  #empty { position:fixed; inset:0 var(--side) 0 0; display:grid; place-content:center; justify-items:center; gap:6px; padding:24px;
           text-align:center; pointer-events:none; }
  #empty[hidden] { display:none; }
  #empty strong { font-size:15px; font-weight:600; }
  #empty span { color:var(--muted); max-width:38ch; text-wrap:balance; }
  #hint { position:fixed; left:16px; bottom:14px; color:var(--muted); font-size:12px; pointer-events:none; }
  kbd { display:inline-block; min-width:16px; padding:0 4px; border:1px solid var(--line-strong); border-radius:4px; font:inherit;
        font-size:10.5px; line-height:15px; text-align:center; }
  #tools { position:fixed; right:calc(var(--side) + 14px); bottom:14px; display:flex; flex-direction:column;
           border:1px solid var(--line); border-radius:8px; background:var(--panel); overflow:hidden; }
  #tools button { width:32px; height:32px; display:grid; place-items:center; border:0; border-radius:0; background:none; color:var(--muted); }
  #tools button + button { border-top:1px solid var(--line); }
  #tools button:hover { background:var(--raised); color:var(--ink); }
  #tools svg { width:16px; height:16px; }

  #side { position:fixed; top:0; right:0; bottom:0; width:var(--side); display:flex; flex-direction:column;
          border-left:1px solid var(--line); background:var(--panel); }
  #side > header { display:flex; align-items:center; gap:8px; padding:14px 16px 12px; }

  h1 { flex:1; min-width:0; margin:0; font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #lang { flex:none; width:auto; height:28px; margin:0; padding:0 4px; background:none; color:var(--muted); font-size:12px; cursor:pointer; }
  #lang:hover { background:var(--raised); color:var(--ink); }

  /* the reading pane: a vault page laid over the graph, the way a note opens beside it */
  #reader { position:fixed; top:0; bottom:0; right:var(--side); width:min(720px, calc(100% - var(--side))); display:flex; flex-direction:column;
            background:var(--panel); border-left:1px solid var(--line); box-shadow:-18px 0 40px -24px rgb(0 0 0 / .45);
            transition:transform .32s cubic-bezier(.16,1,.3,1), opacity .2s; }
  #reader[hidden] { display:flex !important; transform:translateX(24px); opacity:0; pointer-events:none; visibility:hidden;
                    transition:transform .2s, opacity .2s, visibility 0s .2s; }
  #reader > header { display:flex; align-items:center; gap:4px; padding:10px 12px; border-bottom:1px solid var(--line); }
  #r-path { flex:1; min-width:0; margin:0 6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; color:var(--muted);
            direction:rtl; text-align:left; }
  #r-back:disabled { opacity:.35; cursor:default; }
  #r-body { flex:1; overflow:auto; padding:28px 36px 56px; font-size:15px; line-height:1.75; }
  #r-body > * { max-width:68ch; }
  #r-body h1 { margin:0 0 18px; font-size:26px; line-height:1.3; font-weight:700; letter-spacing:-.01em; text-wrap:balance; word-break:break-word; }
  #r-body h2 { margin:34px 0 10px; font-size:17px; font-weight:600; color:var(--ink); }
  #r-body p { margin:0 0 14px; word-break:break-word; }
  #r-body ul { margin:0 0 14px; padding-left:20px; } #r-body li { margin:4px 0; word-break:break-word; } #r-body li::marker { color:var(--muted); }
  #r-body blockquote { margin:0 0 16px; padding:12px 16px; border-radius:10px; background:var(--raised); white-space:pre-wrap; word-break:break-word; }
  #r-body blockquote.note { padding:0; background:none; font-size:12.5px; line-height:1.6; color:var(--muted); }
  #r-body code { padding:1px 5px; border-radius:5px; background:var(--raised); font:12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; word-break:break-all; }
  #r-body a { color:var(--accent); text-decoration:underline; text-underline-offset:3px; cursor:pointer;
              text-decoration-color:color-mix(in srgb, var(--accent) 40%, transparent); }
  #r-body a:hover { text-decoration-color:var(--accent); }
  #r-body .table { max-width:none; margin:0 0 16px; overflow-x:auto; }
  #r-body table { border-collapse:collapse; font-size:13px; line-height:1.5; }
  #r-body th, #r-body td { padding:7px 14px 7px 0; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  #r-body th { font-weight:600; color:var(--muted); white-space:nowrap; }
  h1 b { font-weight:700; letter-spacing:.3em; margin-right:.25em; }
  .icon { width:30px; height:30px; display:grid; place-items:center; padding:0; border:1px solid transparent; border-radius:7px;
          background:none; color:var(--muted); cursor:pointer; }
  .icon:hover { background:var(--raised); color:var(--ink); }
  .icon svg { width:16px; height:16px; }
  :root:not([data-dark]) .icon .sun, :root[data-dark] .icon .moon { display:none; }

  .find { position:relative; margin:0 16px; }
  .find svg { position:absolute; left:10px; top:9px; width:15px; height:15px; color:var(--muted); pointer-events:none; }
  .find input { width:100%; height:34px; padding:0 62px 0 32px; border:1px solid var(--line); border-radius:8px; background:var(--ground);
                color:var(--ink); font:inherit; }
  .find input::placeholder { color:var(--muted); }
  .find input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .find output { position:absolute; right:10px; top:8px; font-size:12px; color:var(--muted); }
  .find output.none { color:var(--danger); }

  #scroll { flex:1; overflow:auto; padding:4px 16px 16px; }
  h2 { margin:22px 0 8px; font-size:12px; font-weight:600; color:var(--muted); }
  .kinds { display:flex; flex-wrap:wrap; gap:6px; }
  .kinds button { display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 9px 0 8px; border:1px solid var(--line);
                  border-radius:13px; background:none; color:var(--ink); font:inherit; font-size:12px; cursor:pointer;
                  transition:background-color .15s, opacity .15s; }
  .kinds button:hover { background:var(--raised); }
  .kinds button[aria-pressed=false] { color:var(--muted); opacity:.62; }
  .kinds button[aria-pressed=false] i { background:none !important; box-shadow:inset 0 0 0 1.5px var(--muted); }
  .kinds i, .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .kinds i.project { border-radius:1px; transform:rotate(45deg) scale(.86); }
  .kinds i.goal { border-radius:2px; }
  .kinds small { font-size:11px; color:var(--muted); }
  select { width:100%; height:32px; margin-top:10px; padding:0 8px; border:1px solid var(--line); border-radius:8px; background:var(--ground);
           color:var(--ink); font:inherit; }
  label.row { display:flex; align-items:center; gap:8px; margin:8px 0 0; cursor:pointer; }
  input[type=checkbox], input[type=range] { accent-color:var(--accent); margin:0; }
  input[type=range] { width:100%; }

  #detail { border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--ground); }
  #detail.idle { border-style:dashed; background:none; color:var(--muted); }
  #d-kind { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  #d-kind[hidden] { display:none; }
  #d-title { margin:6px 0 0; font-size:15px; line-height:1.4; font-weight:600; word-break:break-word; text-wrap:balance; }
  #detail.idle #d-title { margin:0; font-size:13px; font-weight:400; }
  #d-body { margin:8px 0 0; white-space:pre-wrap; word-break:break-word; max-height:220px; overflow:auto; }
  #d-use { display:grid; grid-template-columns:repeat(3, 1fr); margin:12px 0 0; padding:10px 0 0; border-top:1px solid var(--line); }
  #d-use div { display:flex; flex-direction:column-reverse; }
  #d-use dt { font-size:11px; color:var(--muted); } #d-use dd { margin:0; font-size:15px; font-weight:600; }
  #d-meta { margin:10px 0 0; font-size:12px; color:var(--muted); }
  #d-links { list-style:none; margin:12px 0 0; padding:8px 0 0; border-top:1px solid var(--line); }
  #d-links button { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:8px; width:calc(100% + 12px); margin:0 -6px;
                    padding:5px 6px; border:0; border-radius:6px; background:none; color:var(--ink); font:inherit; text-align:left; cursor:pointer; }
  #d-links button:hover { background:var(--raised); }
  #d-links span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #d-links small { font-size:11px; color:var(--muted); }
  #d-page { display:inline-flex; align-items:center; gap:6px; margin-top:12px; padding:0; border:0; background:none; font:inherit; cursor:pointer;
            color:var(--accent); text-decoration:underline;
            text-underline-offset:3px; text-decoration-color:color-mix(in srgb, var(--accent) 40%, transparent); }
  #d-page:hover { text-decoration-color:var(--accent); }
  #d-page svg { width:13px; height:13px; }
  [hidden] { display:none !important; }

  details { margin-top:22px; border-top:1px solid var(--line); }
  summary { display:flex; align-items:center; justify-content:space-between; padding:12px 0 4px; font-size:12px; font-weight:600;
            color:var(--muted); cursor:pointer; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  summary svg { width:14px; height:14px; transition:transform .2s cubic-bezier(.16,1,.3,1); }
  details[open] summary svg { transform:rotate(90deg); }
  label.slide { display:grid; grid-template-columns:84px 1fr; align-items:center; gap:10px; margin:8px 0 0; color:var(--muted); font-size:12px; }
  .text { margin-top:10px; height:28px; padding:0 10px; border:1px solid var(--line); border-radius:7px; background:none; color:var(--ink);
          font:inherit; font-size:12px; cursor:pointer; }
  .text:hover { background:var(--raised); border-color:var(--line-strong); }
  .key { display:grid; grid-template-columns:34px 1fr; align-items:center; gap:4px 10px; margin:10px 0 0; font-size:12px; color:var(--muted); }
  .key svg { width:34px; height:12px; }
  footer { display:flex; align-items:center; gap:10px; padding:10px 16px 12px; border-top:1px solid var(--line); font-size:11px; line-height:1.6; color:var(--muted); }
  footer div { flex:1; min-width:0; } footer p { margin:0; } footer span { white-space:nowrap; }

  @media (max-width: 760px) {
    #graph, #empty { inset:0 0 46% 0; }
    #side { top:54%; width:100%; border-left:0; border-top:1px solid var(--line); }
    #side > header { padding:10px 16px 8px; }
    #scroll { display:flex; flex-direction:column; }
    #scroll > .picked { order:-1; }      /* what was just tapped is read first */
    #scroll > .picked h2 { margin-top:12px; }
    footer p + p { display:none; }
    #tools { right:12px; bottom:calc(46% + 12px); }
    #hint { display:none; }
    #reader { right:0; width:100%; z-index:2; border-left:0; }
    #r-body { padding:20px 18px 40px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div id="graph" role="application" data-t-aria="title" aria-label="지식 그래프"></div>
<div id="empty" hidden><strong id="empty-title"></strong><span id="empty-text"></span></div>
<div id="hint"><span data-t="hint_move">끌어서 이동 · 휠로 확대 · 더블클릭하면 문서 열기</span> · <kbd>/</kbd> <span data-t="hint_search">검색</span> · <kbd>Esc</kbd> <span data-t="hint_esc">선택 해제</span></div>
<div id="tools">
  <button id="zoom-in" data-t-title="zoom_in" title="확대" aria-label="확대"><svg viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></svg></button>
  <button id="zoom-out" data-t-title="zoom_out" title="축소" aria-label="축소"><svg viewBox="0 0 16 16"><path d="M3.5 8h9"/></svg></button>
  <button id="fit" data-t-title="fit" title="화면에 맞추기" aria-label="화면에 맞추기"><svg viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
</div>
<article id="reader" hidden aria-live="polite">
  <header>
    <button class="icon" id="r-back" data-t-title="back" title="뒤로" aria-label="뒤로"><svg viewBox="0 0 16 16"><path d="M9.5 3.5 5 8l4.5 4.5"/></svg></button>
    <p id="r-path"></p>
    <button class="icon" id="r-close" data-t-title="close" title="닫기" aria-label="닫기"><svg viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></svg></button>
  </header>
  <div id="r-body" tabindex="0"></div>
</article>
<aside id="side">
  <header>
    <span class="mark" role="img" aria-label="Lupus"></span>
    <h1><b>LUPUS</b><span data-t="title">지식 그래프</span></h1>
    <button class="icon" id="docs" data-t-title="doc_index" title="Vault 색인" aria-label="Vault 색인">
      <svg viewBox="0 0 16 16"><path d="M4 2.5h5.5L12.5 5.5V13.5H4ZM9.5 2.5V5.5H12.5M6.2 8.3h4M6.2 10.8h4"/></svg>
    </button>
    <button class="icon" id="theme" data-t-title="theme" title="밝게 / 어둡게" aria-label="밝게 / 어둡게">
      <svg class="moon" viewBox="0 0 16 16"><path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8Z"/></svg>
      <svg class="sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M3.5 12.5l1.1-1.1M11.4 4.6l1.1-1.1"/></svg>
    </button>
  </header>
  <div class="find">
    <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2"/><path d="m10.2 10.2 3.3 3.3"/></svg>
    <input type="search" id="search" data-t-placeholder="search" placeholder="제목과 내용에서 찾기" autocomplete="off" spellcheck="false" aria-label="제목과 내용에서 찾기">
    <output id="s-count" for="search"></output>
  </div>
  <div id="scroll">
    <h2 id="kinds-title" data-t="kinds">종류</h2>
    <div class="kinds" id="kinds"></div>
    <select id="scope" data-t-aria="all_projects" aria-label="범위"></select>
    <label class="row"><input type="checkbox" id="recalls" checked> <span data-t="show_recalls">회상된 곳으로 가는 연결 표시</span></label>
    <label class="row"><input type="checkbox" id="retired"> <span data-t="show_retired">은퇴한 노드 표시</span></label>

    <div class="picked">
    <h2 data-t="selected">선택한 노드</h2>
    <section id="detail" class="idle" aria-live="polite">
      <div id="d-kind" hidden><i class="dot" id="d-dot"></i><span id="d-kind-text"></span></div>
      <p id="d-title">노드를 누르면 내용과 연결이 여기에 표시됩니다.</p>
      <p id="d-body" hidden></p>
      <dl id="d-use" hidden>
        <div><dt data-t="recalled">회상</dt><dd id="d-recalled"></dd></div>
        <div><dt data-t="helped">도움 됨</dt><dd id="d-helped"></dd></div>
        <div><dt data-t="unhelped">도움 안 됨</dt><dd id="d-unhelped"></dd></div>
      </dl>
      <p id="d-meta" hidden></p>
      <ul id="d-links" hidden></ul>
      <button type="button" id="d-page" hidden><span data-t="open_page">문서 읽기</span><svg viewBox="0 0 16 16"><path d="M6 3.5h6.5V10M12.5 3.5 4 12"/></svg></button>
    </section>
    </div>

    <details id="layout">
      <summary><span data-t="layout">배치 조정</span><svg viewBox="0 0 16 16"><path d="m6 3.5 4.5 4.5L6 12.5"/></svg></summary>
      <label class="slide"><span data-t="f_repel">반발력</span><input type="range" id="f-repel" min="20" max="400" value="180"></label>
      <label class="slide"><span data-t="f_link">연결 거리</span><input type="range" id="f-link" min="40" max="320" value="165"></label>
      <label class="slide"><span data-t="f_center">중심 인력</span><input type="range" id="f-center" min="0" max="100" value="18"></label>
      <label class="slide"><span data-t="f_size">노드 크기</span><input type="range" id="f-size" min="4" max="24" value="9"></label>
      <label class="row"><input type="checkbox" id="pin"> <span data-t="pin">끌어다 놓은 위치에 고정</span></label>
      <button class="text" id="unpin" data-t="unpin">고정 모두 해제</button>
    </details>

    <details id="legend">
      <summary><span data-t="legend">표기</span><svg viewBox="0 0 16 16"><path d="m6 3.5 4.5 4.5L6 12.5"/></svg></summary>
      <div class="key">
        <svg viewBox="0 0 34 12"><circle cx="17" cy="6" r="4" fill="currentColor" stroke="var(--ink)" stroke-width="2"/></svg><span data-t="k_verified">사용자가 확인한 지식</span>
        <svg viewBox="0 0 34 12"><circle cx="17" cy="6" r="4.4" fill="currentColor" stroke="none"/></svg><span data-t="k_confirmed">반복해서 쓰인 지식</span>
        <svg viewBox="0 0 34 12"><circle cx="17" cy="6" r="4" stroke-dasharray="2.2 2"/></svg><span data-t="k_candidate">아직 검증되지 않은 지식</span>
        <svg viewBox="0 0 34 12"><path d="M2 6h28M27 3l4 3-4 3" stroke-width="1.8"/></svg><span data-t="k_relation">지식 사이의 관계</span>
        <svg viewBox="0 0 34 12"><path d="M2 6h28M27 3l4 3-4 3" stroke="var(--danger)" stroke-width="1.8"/></svg><span data-t="k_contradicts">서로 상충</span>
        <svg viewBox="0 0 34 12"><path d="M2 6h30" stroke-width="1"/></svg><span data-t="k_recorded">기록된 목표</span>
        <svg viewBox="0 0 34 12"><path d="M2 6h30" stroke-width="1" stroke-dasharray="3 3"/></svg><span data-t="k_recalled">회상된 목표</span>
      </div>
    </details>
  </div>
  <footer><div><p><span id="count"></span> · <span data-t="read_only">읽기 전용</span> · <span id="generated"></span></p>
  <p data-t="vendor">vis-network (Apache-2.0 / MIT)를 수정 없이 포함</p></div>
  <select id="lang" data-t-title="language" title="언어" aria-label="언어">
    <option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">简体中文</option>
  </select></footer>
</aside>
<script type="application/json" id="data">__DATA__</script>
<script src="vis-network.min.js"></script>
<script src="viewer.js"></script>
</body>
</html>
