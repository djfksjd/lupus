    --ink:#e8eef8; --muted:#9aaac2; --soft:#7486a2; --faint:#2b3955;
    --accent:#9db5ff; --accent-ink:#0a1120; --accent-soft:#1b2747; --edge:#4e6185; --danger:#f2788a; --ok:#5fcf9f; --warn:#e8b45a;
    --mark-a:#f2f5fa; --mark-b:#a9bad1; --mark-c:#52647f;
    --k-project:#c2cde0; --k-goal:#8aa7ff; --k-lesson:#e6b85a; --k-decision:#b79af7; --k-fact:#5fcf9f;
    --k-procedure:#f2788a; --k-preference:#6cc4e8;
    --t-a:#16224a; --t-b:#22193f; --t-c:#0f2b2a; --t-d:#162235; --t-e:#2c1d14;
    --shadow:0 1px 2px rgb(0 0 0 / .3), 0 12px 32px -14px rgb(0 0 0 / .6);
    --shadow-lift:0 2px 4px rgb(0 0 0 / .35), 0 24px 46px -16px rgb(0 0 0 / .7);
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--ground); color:var(--ink); overflow:hidden;
         font:14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Hiragino Sans", "PingFang SC", "Segoe UI", "Noto Sans", sans-serif;
         font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; }
  /* the display voice: the wordmark's wide geometry, on headings and figures only */
  #top h1, .kpi .value, .legend b, #d-use dd, #d-title, #r-body h1 { font-family:Sora, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Hiragino Sans", "PingFang SC", "Segoe UI", sans-serif; }
  /* two faint moonlight blooms, fixed behind every view */
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
                 background:radial-gradient(64vw 58vh at 82% -6%, var(--bloom-a), transparent 72%),
                            radial-gradient(52vw 60vh at 18% 104%, var(--bloom-b), transparent 72%),
                            radial-gradient(40vw 44vh at 98% 92%, var(--bloom-c), transparent 72%),
                            radial-gradient(34vw 30vh at 34% 30%, color-mix(in srgb, var(--bloom-a) 55%, transparent), transparent 70%); }
  ::selection { background:var(--accent); color:var(--accent-ink); }
  * { scrollbar-width:thin; scrollbar-color:var(--line-strong) transparent; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:10px; }
  button { font:inherit; color:inherit; }
  svg.i { width:18px; height:18px; display:block; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  [hidden] { display:none !important; }
  kbd { display:inline-grid; place-items:center; min-width:20px; height:20px; padding:0 5px; border:1px solid var(--line-strong);
        border-bottom-width:2px; border-radius:6px; font:600 11px/1 inherit; color:var(--muted); background:var(--glass-strong); }

  .glass { background:var(--glass); border:1px solid var(--rim); border-radius:var(--r); box-shadow:var(--shadow);
           -webkit-backdrop-filter:blur(18px) saturate(1.4); backdrop-filter:blur(18px) saturate(1.4); }
  .mark { display:block; background:linear-gradient(160deg, var(--mark-a) 30%, var(--mark-b) 72%, var(--mark-c));
          -webkit-mask:var(--wolf) center / contain no-repeat; mask:var(--wolf) center / contain no-repeat; }

  /* ---------- icon rail */
  #rail { position:fixed; z-index:5; top:12px; bottom:12px; left:12px; width:var(--rail); display:flex; flex-direction:column;
          align-items:center; gap:6px; padding:14px 0; border-radius:24px; }
  #rail .mark { width:42px; height:42px; margin:2px 0 14px; }
  #rail nav { display:flex; flex-direction:column; gap:6px; }
  .rb { position:relative; width:46px; height:46px; display:grid; place-items:center; border:0; border-radius:14px; background:none;
        color:var(--muted); cursor:pointer; transition:background-color .2s, color .2s, transform .2s var(--ease); }
  .rb:hover { background:var(--hover); color:var(--ink); }
  .rb[aria-current=page] { background:var(--ink); color:var(--ground); box-shadow:0 8px 18px -8px rgb(15 27 45 / .55); }
  :root[data-dark] .rb[aria-current=page] { background:var(--accent); color:var(--accent-ink); box-shadow:0 8px 18px -8px rgb(0 0 0 / .7); }
  .rb::after { content:attr(data-tip); position:absolute; left:calc(100% + 12px); top:50%; transform:translate(-4px, -50%);
               padding:6px 10px; border-radius:9px; background:var(--ink); color:var(--ground); font-size:12px; font-weight:600;
               white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .15s, transform .2s var(--ease); }
  .rb:hover::after, .rb:focus-visible::after { opacity:1; transform:translate(0, -50%); }
  #rail .spacer { flex:1; }
  #lang { width:46px; height:30px; border:0; border-radius:10px; background:none; color:var(--muted); font:600 11px/1 inherit;
          text-align:center; text-align-last:center; cursor:pointer; -webkit-appearance:none; appearance:none; }
  #lang:hover { background:var(--hover); color:var(--ink); }
  :root:not([data-dark]) .rb .sun, :root[data-dark] .rb .moon { display:none; }

  /* ---------- top bar */
  main { position:relative; display:flex; flex-direction:column; min-width:0; padding:16px 20px 24px 0; }
  #top { display:flex; align-items:center; gap:16px; margin-bottom:20px; }
  #top .heading { flex:1; min-width:0; }
  #top h1 { margin:0; font-size:24px; line-height:1.2; font-weight:620; letter-spacing:-.025em; }
  #top p { margin:4px 0 0; color:var(--muted); font-size:13.5px; }
  #find { display:flex; align-items:center; gap:10px; width:min(340px, 34vw); height:44px; padding:0 8px 0 14px; border:1px solid var(--rim);
          border-radius:22px; background:var(--glass); color:var(--soft); box-shadow:var(--shadow); cursor:text; text-align:left;
          -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); transition:box-shadow .2s, border-color .2s; }
  #find:hover { border-color:var(--line-strong); box-shadow:var(--shadow-lift); }
  #find span { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  #stamp { color:var(--soft); font-size:12px; white-space:nowrap; }

  /* ---------- views and the blur-in page change */
  .view { flex:1; min-height:0; overflow:auto; padding:2px 2px 120px; }
  .view.enter { animation:blurin .42s var(--ease) both; }
  @keyframes blurin { from { opacity:0; filter:blur(10px); transform:translateY(8px); } to { opacity:1; filter:none; transform:none; } }
  .stagger > * { animation:rise .56s var(--ease) both; animation-delay:calc(var(--i, 0) * 55ms + 60ms); }
  @keyframes rise { from { opacity:0; transform:translateY(14px) scale(.985); filter:blur(6px); } to { opacity:1; transform:none; filter:none; } }

  .card { position:relative; padding:18px 20px; transition:transform .28s var(--ease), box-shadow .28s var(--ease); overflow:hidden; }
  .card.lift:hover { transform:translateY(-4px); box-shadow:var(--shadow-lift); }
  .card h2 { display:flex; align-items:center; gap:8px; margin:0 0 12px; font-size:14px; font-weight:650; }
  .card h2 small { margin-left:auto; color:var(--soft); font-size:12px; font-weight:500; }
  .card .more { margin-left:auto; display:inline-flex; align-items:center; gap:4px; padding:4px 8px; border:0; border-radius:9px; background:none;
                color:var(--accent); font-size:12.5px; font-weight:600; cursor:pointer; }
  .card .more:hover { background:var(--accent-soft); }
  .card .more svg { width:14px; height:14px; }

  /* KPI stat cards */
  .kpis { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:16px; margin-bottom:16px; }
  .kpi { min-height:128px; display:flex; flex-direction:column; }
  .kpi::before { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(140deg, var(--tint) 0%, transparent 62%); }
  .kpi .label { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; font-weight:550; }
  .kpi .badge { width:30px; height:30px; display:grid; place-items:center; border-radius:10px; background:var(--glass-strong); color:var(--ink);
                box-shadow:0 1px 2px rgb(15 27 45 / .06); }
  .kpi .badge svg { width:16px; height:16px; }
  .kpi .value { margin-top:auto; font-size:30px; line-height:1.1; font-weight:600; letter-spacing:-.03em; }
  .kpi .value small { font-size:15px; font-weight:600; color:var(--muted); letter-spacing:0; margin-left:2px; }
  .kpi .sub { margin-top:4px; color:var(--muted); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* bento grid */
  .bento { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); grid-auto-rows:minmax(150px, auto); gap:16px; }
  .span2 { grid-column:span 2; } .tall { grid-row:span 2; }
  #mini { position:absolute; inset:52px 0 0; }
  #mini-empty { position:absolute; inset:52px 20px 20px; display:grid; place-content:center; text-align:center; color:var(--muted); gap:4px; }
  .bar { display:flex; height:14px; border-radius:7px; overflow:hidden; background:var(--line); }
  .bar i { display:block; height:100%; transition:flex-grow .6s var(--ease); }
  .legend { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px; margin-top:16px; }
  .legend div { display:flex; flex-direction:column; gap:2px; }
  .legend b { font-size:20px; font-weight:680; letter-spacing:-.02em; }
  .legend span { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .dot.hollow { background:none !important; box-shadow:inset 0 0 0 1.6px var(--soft); }
  .rows { list-style:none; margin:0; padding:0; }
  .rows li + li { border-top:1px solid var(--line); }
  .row { display:grid; grid-template-columns:auto minmax(0, 1fr) auto; align-items:center; gap:10px; width:100%; padding:9px 6px;
         border:0; border-radius:10px; background:none; text-align:left; cursor:pointer; }
  .row:hover { background:var(--hover); }
  .row span { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .row small { color:var(--soft); font-size:12px; white-space:nowrap; }
  .meter { display:grid; grid-template-columns:96px minmax(0, 1fr) 28px; align-items:center; gap:10px; padding:6px 0; font-size:13px; }
  .meter span { display:flex; align-items:center; gap:7px; color:var(--muted); }
  .meter em { display:block; height:8px; border-radius:4px; background:currentColor; min-width:3px; transition:width .6s var(--ease); }
  .meter b { text-align:right; font-weight:600; }
  .chip { display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px; border-radius:12px; font-size:12px; font-weight:600;
          background:var(--hover); color:var(--muted); white-space:nowrap; }
  .chip.done { background:color-mix(in srgb, var(--ok) 14%, transparent); color:var(--ok); }
  .chip.active { background:var(--accent-soft); color:var(--accent); }
  .chip.wait { background:color-mix(in srgb, var(--warn) 16%, transparent); color:var(--warn); }
  .chip.stop { background:color-mix(in srgb, var(--danger) 13%, transparent); color:var(--danger); }
  .moon-glyph { width:12px; height:12px; flex:none; }
  .empty { padding:24px 6px; color:var(--muted); text-align:center; }
  .empty strong { display:block; color:var(--ink); margin-bottom:4px; }

  /* ---------- graph view */
  #view-graph { overflow:hidden; padding-bottom:16px; }
  #stage { position:relative; height:100%; min-height:420px; }
  #graph { position:absolute; inset:0; border-radius:var(--r); cursor:grab; }
  #graph:active { cursor:grabbing; }
  #filters { position:absolute; z-index:2; top:14px; left:14px; right:14px; display:flex; flex-wrap:wrap; align-items:center; gap:8px;
             padding:8px; border-radius:16px; pointer-events:auto; }
  .kinds { display:flex; flex-wrap:wrap; gap:6px; }
  .kinds button { display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 11px 0 9px; border:1px solid var(--line);
                  border-radius:15px; background:var(--glass-strong); font-size:12.5px; font-weight:550; cursor:pointer;
                  transition:background-color .15s, opacity .15s, border-color .15s; }
  .kinds button:hover { border-color:var(--line-strong); }
  .kinds button[aria-pressed=false] { color:var(--soft); opacity:.6; }
  .kinds button[aria-pressed=false] .dot { background:none !important; box-shadow:inset 0 0 0 1.6px var(--soft); }
  .kinds small { color:var(--soft); font-size:11.5px; }
  .ctl { display:inline-flex; align-items:center; gap:7px; height:30px; padding:0 10px; border:1px solid var(--line); border-radius:15px;
         background:var(--glass-strong); color:var(--muted); font-size:12.5px; cursor:pointer; }
  .ctl input { accent-color:var(--accent); margin:0; }
  select.ctl { padding-right:28px; -webkit-appearance:none; appearance:none; color:var(--ink);
               background:linear-gradient(45deg, transparent 50%, var(--soft) 50%) no-repeat calc(100% - 15px) 13px / 5px 5px,
                          linear-gradient(-45deg, transparent 50%, var(--soft) 50%) no-repeat calc(100% - 10px) 13px / 5px 5px, var(--glass-strong); }
  #filters .grow { flex:1; }
  #tools { position:absolute; z-index:2; right:14px; bottom:14px; display:flex; flex-direction:column; padding:4px; border-radius:14px; }
  #tools button { width:36px; height:36px; display:grid; place-items:center; border:0; border-radius:10px; background:none; color:var(--muted); cursor:pointer; }
  #tools button:hover { background:var(--hover); color:var(--ink); }
  #g-empty { position:absolute; inset:0; display:grid; place-content:center; justify-items:center; gap:6px; padding:24px; text-align:center; pointer-events:none; }
  #g-empty strong { font-size:16px; } #g-empty span { color:var(--muted); max-width:42ch; }
  #g-hint { position:absolute; z-index:2; left:16px; bottom:16px; color:var(--soft); font-size:12px; pointer-events:none; }

  /* ---------- knowledge view */
  .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:14px; }
  .field { display:flex; align-items:center; gap:8px; height:36px; padding:0 12px; border:1px solid var(--rim); border-radius:12px;
           background:var(--glass); min-width:260px; color:var(--soft); }
  .field input { flex:1; min-width:0; border:0; outline:0; background:none; color:var(--ink); font:inherit; }
  .field input::placeholder { color:var(--soft); }
  .field:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  table.list { width:100%; border-collapse:separate; border-spacing:0; font-size:13.5px; }
  .list th { position:sticky; top:0; z-index:1; padding:12px 14px; text-align:left; font-size:12px; font-weight:600; color:var(--muted);
             background:var(--glass-strong); border-bottom:1px solid var(--line); white-space:nowrap; }
  .list th button { border:0; background:none; padding:0; color:inherit; font:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
  .list th button:hover { color:var(--ink); }
  .list th[aria-sort] button::after { content:""; width:0; height:0; border:4px solid transparent; border-top-color:currentColor; margin-top:4px; }
  .list th[aria-sort=ascending] button::after { border-top-color:transparent; border-bottom-color:currentColor; margin:0 0 4px; }
  .list td { padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .list tbody tr { cursor:pointer; transition:background-color .15s; }
  .list tbody tr:hover { background:var(--hover); }
  .list tbody tr[aria-selected=true] { background:var(--accent-soft); }
  .list .t { display:flex; align-items:center; gap:10px; max-width:520px; }
  .list .t span { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-weight:550; }
  .list .n { text-align:right; font-weight:600; }
  .tablecard { padding:0; }

  /* ---------- documents view */
  .docs { display:grid; grid-template-columns:clamp(200px, 20vw, 260px) minmax(0, 1fr); gap:16px; height:100%; min-height:440px; }
  #view-docs { padding-bottom:16px; }
  #tree { padding:12px; overflow:auto; }
  .tree, .tree ul { list-style:none; margin:0; padding:0; }
  .tree ul { margin-left:13px; padding-left:10px; border-left:1px solid var(--line); }
  .tree button { display:flex; align-items:center; gap:8px; width:100%; padding:7px 8px; border:0; border-radius:9px; background:none;
                 font-size:13px; text-align:left; cursor:pointer; color:var(--ink); }
  .tree button:hover { background:var(--hover); }
  .tree button[aria-current=true] { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .tree button span { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .tree button small { color:var(--soft); font-size:11.5px; }
  .tree .folder > button { font-weight:600; color:var(--muted); }
  .tree .folder > button svg.chev { width:14px; height:14px; transition:transform .2s var(--ease); }
  .tree .folder[aria-expanded=true] > button svg.chev { transform:rotate(90deg); }
  .tree .folder[aria-expanded=false] > ul { display:none; }
  #reader { display:flex; flex-direction:column; min-width:0; padding:0; }
  #reader > header { display:flex; align-items:center; gap:6px; padding:12px 14px; border-bottom:1px solid var(--line); }
  #r-path { flex:1; min-width:0; margin:0 6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12.5px; color:var(--soft);
            direction:rtl; text-align:left; }
  .ib { width:34px; height:34px; display:grid; place-items:center; border:0; border-radius:10px; background:none; color:var(--muted); cursor:pointer; }
  .ib:hover { background:var(--hover); color:var(--ink); }
  .ib:disabled { opacity:.35; cursor:default; background:none; }
  #r-body { flex:1; overflow:auto; padding:24px 28px 32px; font-size:15px; line-height:1.75; }
  #r-body > * { max-width:70ch; }
  #r-body h1 { margin:0 0 18px; font-size:26px; line-height:1.3; font-weight:700; letter-spacing:-.015em; text-wrap:balance; word-break:break-word; }
  #r-body h2 { margin:34px 0 10px; font-size:17px; font-weight:650; }
  #r-body p { margin:0 0 14px; word-break:break-word; }
  #r-body ul { margin:0 0 14px; padding-left:20px; } #r-body li { margin:4px 0; word-break:break-word; } #r-body li::marker { color:var(--soft); }
  #r-body blockquote { margin:0 0 16px; padding:12px 16px; border-radius:12px; background:var(--hover); white-space:pre-wrap; word-break:break-word; }
  #r-body blockquote.note { padding:0; background:none; font-size:12.5px; line-height:1.6; color:var(--soft); }
  #r-body code { padding:1px 6px; border-radius:6px; background:var(--hover); font:12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap:anywhere; word-break:normal; }
  #r-body a { color:var(--accent); text-decoration:underline; text-underline-offset:3px; cursor:pointer;
              text-decoration-color:color-mix(in srgb, var(--accent) 40%, transparent); }
  #r-body a:hover { text-decoration-color:var(--accent); }
  #r-body .table { max-width:none; margin:0 0 16px; overflow-x:auto; }
  #r-body table { border-collapse:collapse; font-size:13px; line-height:1.5; }
  #r-body th, #r-body td { padding:8px 14px 8px 0; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  #r-body th { font-weight:600; color:var(--muted); white-space:nowrap; }

  /* ---------- goals view */
  .projects { display:grid; grid-template-columns:repeat(auto-fit, minmax(420px, 1fr)); gap:16px; align-items:start; }
  .goal { display:grid; grid-template-columns:auto minmax(0, 1fr) auto; gap:4px 12px; align-items:center; padding:12px 8px; border:0;
          border-radius:12px; background:none; width:100%; text-align:left; cursor:pointer; }
  .goal:hover { background:var(--hover); }
  .goal .moon-glyph { width:16px; height:16px; grid-row:span 2; }
  .goal span { overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; font-weight:550; }
  .goal .chip { display:inline-flex; -webkit-line-clamp:none; }
  .goal small { grid-column:2; color:var(--soft); font-size:12px; }
  .goal .chip { grid-row:span 2; }

  /* ---------- the detail drawer, shared by the graph and the knowledge list */
  @media (min-width: 901px) { body.drawn #view-graph, body.drawn #view-knowledge { padding-right:376px; } }
  #drawer { position:fixed; z-index:6; top:var(--workspace-top, 96px); right:20px; bottom:88px; width:min(360px, calc(100vw - 32px)); display:flex; flex-direction:column;
            background:var(--glass-strong); transition:transform .36s var(--ease), opacity .24s; }
  #drawer.shut { transform:translateX(24px); opacity:0; pointer-events:none; visibility:hidden; transition:transform .24s, opacity .2s, visibility 0s .24s; }
  #drawer > header { display:flex; align-items:flex-start; gap:8px; padding:16px 12px 0 18px; }
  #drawer > header #d-title { flex:1; margin:0; }
  #d-kind { display:flex; align-items:center; gap:8px; margin:8px 0 0; color:var(--muted); font-size:12.5px; font-weight:550; }
  #d-scroll { flex:1; overflow:auto; padding:6px 18px 18px; }
  #d-title { font-size:18px; line-height:1.35; font-weight:680; letter-spacing:-.01em; word-break:break-word; text-wrap:balance; }
  #d-body { margin:10px 0 0; color:var(--muted); white-space:pre-wrap; word-break:break-word; }
  #d-use { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:16px 0 0; }
  #d-use div { padding:10px 12px; border-radius:12px; background:var(--hover); display:flex; flex-direction:column-reverse; }
  #d-use dt { font-size:11.5px; color:var(--muted); } #d-use dd { margin:0; font-size:20px; font-weight:680; }
  #d-meta { margin:12px 0 0; font-size:12.5px; color:var(--soft); }

</aside>

<main>
  <header id="top">
    <div class="heading"><h1 id="v-title"></h1><p id="v-sub"></p></div>
    <span id="stamp"></span>
    <button id="find" type="button"><svg class="i" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg><span data-t="find_ph"></span><kbd>/</kbd></button>
    <button id="launch" data-t-aria="chat_title" data-t-title="chat_title" aria-controls="chat" aria-expanded="false" type="button"><span class="orb"><span class="mark"></span></span><span data-t="launcher"></span><kbd>⌘K</kbd></button>
  </header>

  <section class="view" id="view-overview">
    <div class="kpis stagger" id="kpis"></div>
    <div class="bento stagger">
      <article class="card glass span2 tall" style="--i:5">
        <h2><span data-t="c_graph"></span><button class="more" data-go="graph"><span data-t="open"></span><svg class="i" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></button></h2>
        <div id="mini"></div>
        <div id="mini-empty" hidden><strong data-t="none_title"></strong><span data-t="none_text"></span></div>
      </article>
      <article class="card glass lift span2" style="--i:6">
        <h2><span data-t="c_trust"></span><small id="trust-note"></small></h2>
        <div class="bar" id="trust-bar"></div>
        <div class="legend" id="trust-legend"></div>
      </article>
      <article class="card glass lift" style="--i:7"><h2><span data-t="c_kinds"></span></h2><div id="kind-meters"></div></article>
      <article class="card glass lift" style="--i:8">
        <h2><span data-t="c_goals"></span><button class="more" data-go="goals"><span data-t="all"></span><svg class="i" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button></h2>
        <ul class="rows" id="goal-rows"></ul>
      </article>
      <article class="card glass lift span2" style="--i:9">
        <h2><span data-t="c_helped"></span><button class="more" data-go="knowledge"><span data-t="all"></span><svg class="i" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button></h2>
        <ul class="rows" id="helped-rows"></ul>
      </article>
      <article class="card glass lift span2" style="--i:10">
        <h2><span data-t="c_docs"></span><button class="more" data-go="docs"><span data-t="open"></span><svg class="i" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button></h2>
        <ul class="rows" id="doc-rows"></ul>
      </article>
    </div>
  </section>

  <section class="view" id="view-graph" hidden>
    <div id="stage" class="glass">
      <div id="graph" role="application" data-t-aria="v_graph"></div>
      <div id="filters" class="glass">
        <div class="graph-topline">
          <div class="kinds" id="kinds"></div>
          <div class="graph-actions">
            <button id="filter-toggle" type="button" aria-expanded="false" aria-controls="graph-options" data-t-title="graph_filters"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></svg><span data-t="graph_filters"></span></button>
            <div id="tools" role="group" data-t-aria="v_graph">
              <button id="zoom-in" data-t-title="zoom_in"><svg class="i" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
              <button id="zoom-out" data-t-title="zoom_out"><svg class="i" viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
              <button id="fit" data-t-title="fit"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
              <button id="graph-fullscreen" type="button" aria-pressed="false" data-t-title="graph_fullscreen"><svg class="i expand-icon" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7"/></svg><svg class="i collapse-icon" viewBox="0 0 24 24"><path d="M20 10h-6V4M14 10l7-7M4 14h6v6M10 14l-7 7"/></svg><span id="fullscreen-label" data-t="graph_fullscreen"></span></button>
            </div>
          </div>
        </div>
        <div id="graph-options" hidden>
          <select class="ctl" id="scope" data-t-aria="all_projects"></select>
          <label class="ctl"><input type="checkbox" id="recalls" checked><span data-t="show_recalls"></span></label>
          <label class="ctl"><input type="checkbox" id="retired"><span data-t="show_retired"></span></label>
          <label class="ctl"><input type="checkbox" id="pin"><span data-t="pin"></span></label>
          <button id="unpin" class="ctl" data-t-title="unpin"><svg class="i" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3H7l3-3ZM12 13v7M4 4l16 16"/></svg><span data-t="unpin"></span></button>
        </div>
      </div>
      <p id="fullscreen-status" class="sr-only" role="status"></p>
      <div id="g-empty" hidden><strong id="g-empty-title"></strong><span id="g-empty-text"></span></div>
      <div id="g-hint" data-t="hint_move"></div>

    </div>
  </section>

  <section class="view" id="view-knowledge" hidden>
    <div class="toolbar">
      <label class="field"><svg class="i" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg><input id="k-filter" type="search" autocomplete="off" spellcheck="false" data-t-placeholder="filter_ph"></label>
      <select class="ctl" id="k-status" data-t-aria="c_trust"></select>
      <select class="ctl" id="k-kind" data-t-aria="c_kinds"></select>
      <span class="grow"></span><small id="k-count" style="color:var(--soft)"></small>
    </div>
    <div class="card glass tablecard"><table class="list" id="k-table"><thead><tr>
      <th data-sort="title"><button data-t="col_title"></button></th><th data-sort="kind"><button data-t="col_kind"></button></th>
      <th data-sort="status"><button data-t="col_status"></button></th><th data-sort="scope"><button data-t="col_project"></button></th>
      <th data-sort="recalled" class="n"><button data-t="recalled"></button></th><th data-sort="helped" class="n"><button data-t="helped"></button></th>
    </tr></thead><tbody id="k-rows"></tbody></table>
    <div class="empty" id="k-empty" hidden></div></div>
  </section>

  <section class="view" id="view-docs" hidden>
    <div class="docs">
      <button id="tree-toggle" class="ctl" type="button" aria-expanded="false" aria-controls="tree"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span data-t="document_list"></span></button>
      <nav id="tree" class="glass" data-t-aria="v_docs"></nav>
      <article id="reader" class="glass" aria-live="polite">
        <header>
          <button class="ib" id="r-back" data-t-title="back"><svg class="i" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button>
          <p id="r-path"></p>
          <button class="ib" id="r-node" data-t-title="show_in_graph"><svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="17.5" r="2.5"/><path d="M8.3 8.1 10.6 15.3M15.8 7.4 13.3 15.3M8.4 6.7l7.1-.5"/></svg></button>
        </header>
        <div id="r-body" tabindex="0"></div>
      </article>
    </div>
  </section>

  <section class="view" id="view-goals" hidden><div class="projects stagger" id="projects"></div></section>
</main>

<aside id="drawer" class="glass shut" aria-live="polite">
  <header><p id="d-title"></p>
    <button class="ib" id="d-close" data-t-title="close"><svg class="i" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
  <div id="d-scroll">
    <div id="d-kind"><i class="dot" id="d-dot"></i><span id="d-kind-text"></span></div>
    <p id="d-body" hidden></p>
    <dl id="d-use" hidden>
      <div><dt data-t="recalled"></dt><dd id="d-recalled"></dd></div>
      <div><dt data-t="helped"></dt><dd id="d-helped"></dd></div>
      <div><dt data-t="unhelped"></dt><dd id="d-unhelped"></dd></div>
    </dl>
    <p id="d-meta" hidden></p>
    <p id="d-links-title" data-t="links" hidden></p>
    <ul class="rows" id="d-links" hidden></ul>
    <button type="button" id="d-page" hidden><span data-t="open_page"></span><svg class="i" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></button>
  </div>
</aside>


<button id="chat-fab" type="button" data-t-aria="chat_title" aria-controls="chat" aria-expanded="false"><span class="orb" aria-hidden="true"><span class="mark"></span></span><span data-t="chat_title"></span></button>
<aside id="chat" hidden aria-labelledby="chat-title">
  <header><strong id="chat-title" data-t="chat_title"></strong><button id="chat-new" class="ib" type="button" data-t-title="chat_new"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button id="chat-close" class="ib" type="button" data-t-title="close"><svg class="i" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
  <p id="chat-context"></p>
  <div id="chat-thread" role="log" aria-live="polite"></div>
  <p id="chat-status" role="status"></p>
  <form id="chat-form"><textarea id="chat-input" maxlength="4000" data-t-placeholder="chat_ph" data-t-aria="chat_ph"></textarea><div id="chat-actions"><select id="chat-driver" aria-label="AI"><option value="claude">Claude</option><option value="codex">Codex</option></select><small data-t="chat_private"></small><button id="chat-send" type="submit" data-t="chat_send"></button></div></form>
</aside>

<div id="palette" hidden role="dialog" aria-modal="true" data-t-aria="launcher">
  <div class="glass">
    <div id="p-field"><span class="orb"><span class="mark"></span></span><input id="p-input" type="text" autocomplete="off" spellcheck="false" data-t-placeholder="palette_ph"></div>
    <ul id="p-list" role="listbox"></ul>
    <div id="p-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> <span data-t="p_move"></span></span><span><kbd>↵</kbd> <span data-t="p_open"></span></span><span><kbd>esc</kbd> <span data-t="close"></span></span></div>
  </div>
</div>

<script type="application/json" id="data">__DATA__</script>
<script src="vis-network.min.js"></script>
<img id="nebula-texture" src="data:image/webp;base64,__NEBULA_TEXTURE__" hidden alt="">
<img id="planet-texture" src="data:image/webp;base64,__PLANET_TEXTURE__" hidden alt="">
<script src="space.min.js"></script>
<script src="viewer.js"></script>
</body>
</html>
