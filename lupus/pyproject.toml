[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lupus"
version = "0.2.0"
description = "Deterministic local supervisor for goal-driven work across Claude Code and Codex CLI"
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
dependencies = []

[project.scripts]
lupus = "lupus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lupus = ["migrations/*.sql", "viewer/*", "viewer/vendor/*", "vendor/*", "vendor/*/*"]
